name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Cancel superseded runs of the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which areas a change touches, so the other jobs can skip themselves.
  # Skipped jobs count as successful for required checks, so this is safe with
  # branch protection. Changes to the workflow itself run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      database: ${{ steps.filter.outputs.database }}
      specs: ${{ steps.filter.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contract:
              - 'openapi/**'
              - 'backend/**'
              - 'frontend/**'
              - 'supabase/**'
              - '.github/**'
            backend:
              - 'backend/**'
              - 'openapi/**'
              - 'supabase/migrations/**'
              - '.github/**'
            frontend:
              - 'frontend/**'
              - 'openapi/**'
              - '.github/**'
            database:
              - 'supabase/**'
              - '.github/**'
            specs:
              - 'openspec/**'
              - '.github/**'

  # The OpenAPI contract is the source of truth: lint it, regenerate everything
  # derived from it (Go HTTP layer, sqlc, frontend client) and fail on any drift.
  contract:
    name: Contract and generated code
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Lint the contract
        run: npx --yes @redocly/cli@2.63.0 lint openapi/openapi.yaml --config openapi/redocly.yaml
      - name: Regenerate backend code (oapi-codegen + sqlc)
        working-directory: backend
        run: |
          make generate-api
          # sqlc fails when there are no queries yet, so only run it once some exist.
          if compgen -G "internal/platform/database/queries/*.sql" > /dev/null; then
            make generate-db
          fi
      - name: Regenerate frontend client
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run generate:api
      - name: Fail if generated code is out of date
        run: |
          git status --short
          git diff --exit-code || {
            echo "::error::Generated code is out of date. Run 'make generate' in backend/ and 'bun run generate:api' in frontend/, then commit the result."
            exit 1
          }

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  backend-lint:
    name: Backend lint (golangci-lint)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend

  frontend:
    name: Frontend (Nuxt)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  # Applies every migration from scratch on a local Supabase stack and lints the schema.
  database:
    name: Database (Supabase)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations from scratch
        run: supabase db reset
      - name: Lint the schema
        run: supabase db lint --fail-on error
      - name: Run database tests
        run: |
          if [ -d supabase/tests ]; then supabase test db; else echo "No database tests yet."; fi

  specs:
    name: OpenSpec
    needs: changes
    if: needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changes and specs
        run: npx --yes @fission-ai/openspec@1.14.2 validate --all --strict --no-interactive

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
