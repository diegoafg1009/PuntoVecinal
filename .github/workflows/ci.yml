name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Cancel superseded runs of the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The OpenAPI contract is the source of truth: lint it, regenerate everything
  # derived from it (Go HTTP layer, sqlc, frontend client) and fail on any drift.
  contract:
    name: Contract and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Lint the contract
        run: npx --yes @redocly/cli@2.63.0 lint openapi/openapi.yaml --config openapi/redocly.yaml
      - name: Regenerate backend code (oapi-codegen + sqlc)
        working-directory: backend
        run: |
          make generate-api
          # sqlc fails when there are no queries yet, so only run it once some exist.
          if compgen -G "internal/platform/database/queries/*.sql" > /dev/null; then
            make generate-db
          fi
      - name: Regenerate frontend client
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run generate:api
      - name: Fail if generated code is out of date
        run: |
          git status --short
          git diff --exit-code || {
            echo "::error::Generated code is out of date. Run 'make generate' in backend/ and 'bun run generate:api' in frontend/, then commit the result."
            exit 1
          }

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  backend-lint:
    name: Backend lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

  frontend:
    name: Frontend (Nuxt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  # Applies every migration from scratch on a local Supabase stack and lints the schema.
  database:
    name: Database (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations from scratch
        run: supabase db reset
      - name: Lint the schema
        run: supabase db lint --fail-on error
      - name: Run database tests
        run: |
          if [ -d supabase/tests ]; then supabase test db; else echo "No database tests yet."; fi

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changes and specs
        run: npx --yes @fission-ai/openspec@latest validate --all --strict --no-interactive

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
