server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # TLS is terminated by the proxy in front of this container, so absolute
  # redirects (e.g. /welcome -> /welcome/) would point to http://. Keep them
  # relative so the browser stays on the scheme it used.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets can be cached for a long time.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: client-side routes resolve to index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
