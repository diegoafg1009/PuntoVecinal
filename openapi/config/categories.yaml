# oapi-codegen config for module categories. Run from backend/ (see `make generate-api`):
#   go tool oapi-codegen -config ../openapi/config/categories.yaml ../openapi/dist/openapi.yaml
package: api
output: internal/categories/api/generated.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  include-tags: [categories]
