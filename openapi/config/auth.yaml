# oapi-codegen config for module auth. Run from backend/ (see `make generate-api`):
#   go tool oapi-codegen -config ../openapi/config/auth.yaml ../openapi/dist/openapi.yaml
package: api
output: internal/auth/api/generated.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  include-tags: [auth]
