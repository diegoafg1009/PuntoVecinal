# sqlc config. Run from backend/:
#   go tool sqlc generate
version: "2"
sql:
  - engine: postgresql
    schema: ../supabase/migrations
    queries: internal/platform/database/queries
    gen:
      go:
        package: database
        out: internal/platform/database
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
